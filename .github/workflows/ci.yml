# ============================================================
# 最小 CI：质量门禁 + 主干自动部署
# PR / push → typecheck(app) + typecheck(functions) + build
# push main → 额外部署到 Cloudflare Pages（项目 jacktan-studio）
#
# 所需 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   Pages 部署用 API Token
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Typecheck (functions)
        run: npm run typecheck:functions

      - name: Build
        run: npm run build

      - name: Sanity checks (部署产物)
        run: |
          test -f dist/index.html || (echo "::error::缺少 dist/index.html" && exit 1)
          test -f dist/robots.txt || (echo "::error::缺少 dist/robots.txt" && exit 1)
          test -f dist/sitemap.xml || (echo "::error::缺少 dist/sitemap.xml" && exit 1)
          test -f dist/_headers || (echo "::error::缺少 dist/_headers（安全头会丢失）" && exit 1)
          test -d functions || (echo "::error::缺少 functions 目录（API 会全灭）" && exit 1)
          echo "产物检查通过"

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name jacktan-studio --commit-hash ${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
