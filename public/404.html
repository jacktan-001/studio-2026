<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · Jack Tan Studio</title>
    <style>
      :root { --bg:#08080a; --fg:#f5f5f7; --muted:rgba(245,245,247,.56); --accent:#7c3aed; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--fg);
        font-family: 'Inter Tight','Inter',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
        display: flex; align-items: center; justify-content: center; min-height: 100%;
        -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      }
      .wrap { text-align: center; padding: 32px; }
      .code {
        font-size: clamp(80px, 22vw, 200px); font-weight: 800; line-height: 1;
        background: linear-gradient(180deg, var(--accent), #a78bfa);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        letter-spacing: -.04em;
      }
      .msg { color: var(--muted); margin: 18px 0 28px; font-size: 16px; }
      .home {
        display: inline-block; padding: 12px 22px; border-radius: 999px;
        background: rgba(124,58,237,.16); color: var(--fg);
        text-decoration: none; font-weight: 600; border: 1px solid rgba(124,58,237,.4);
        transition: background .2s ease;
      }
      .home:hover { background: rgba(124,58,237,.3); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <p class="msg">这条路径没有声音，也没有形状。</p>
      <a class="home" href="/">← 返回工作室</a>
    </div>
  </body>
</html>
